<!DOCTYPE html>
<!-- lang+translate="no": запрещаем авто-перевод страницы. Google Translate
     мутирует DOM под Flutter web → краш `removeChild на null` в микротаск-петле
     (зависал результат конвертера/любое async-обновление UI). -->
<html lang="ru" translate="no">
<head>
  <meta name="google" content="notranslate">
  <meta name="robots" content="notranslate">
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="AutoBase — осмотры и отчёты по автомобилям">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="AutoBase">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>AutoBase</title>
  <link rel="manifest" href="manifest.json">

  <!-- cropperjs — нужен для image_cropper на web (кроп аватарки) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>
  <!-- Круглая рамка кропа (как в Telegram): скругляем crop-box cropper.js.
       Output остаётся квадратным JPEG — на отображении он всё равно ClipOval. -->
  <style>
    .cropper-view-box,
    .cropper-face {
      border-radius: 50%;
    }
  </style>
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="vin_ocr.js?v=20260330_2"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
